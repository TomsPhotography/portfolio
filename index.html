<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toms Photography</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: white;
    }

    header {
      text-align: center;
      padding: 60px 20px;
    }

    header h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    header p {
      opacity: 0.7;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      display: block;
    }

    .about {
      padding: 40px 20px;
      max-width: 600px;
      margin: auto;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 30px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<header>
  <h1>Toms Photography</h1>
  <p>Capturing real moments.</p>
</header>

<section class="gallery">
  <img src="photo1.JPG">
  <img src="photo2.JPG">
  <img src="photo3.JPG">
  <img src="photo4.JPG">
</section>

<section class="about">
  <h2>About</h2>
  <p>
    I focus on capturing real, unposed moments. My goal is to create images that feel natural, not forced.
  </p>
</section>

<footer>
  <p>Contact: neiltoms485@gmail.com</p>
</footer>

</body>
</html>
