<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toms Photography</title>

  <style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a0a;
    color: white;
  }

  header {
    text-align: center;
    padding: 100px 20px 60px;
  }

  header h1 {
    font-size: 42px;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  header p {
    opacity: 0.6;
    font-size: 16px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    padding: 40px 40px 80px;
    max-width: 1200px;
    margin: auto;
  }

  .gallery img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    border-radius: 6px;
    transition: transform 0.3s ease;
  }

  .gallery img:hover {
    transform: scale(1.03);
  }

  .about {
    padding: 60px 20px;
    max-width: 600px;
    margin: auto;
    text-align: center;
  }

  .about h2 {
    margin-bottom: 15px;
  }

  .about p {
    opacity: 0.7;
    line-height: 1.6;
  }

  footer {
    text-align: center;
    padding: 40px;
    opacity: 0.5;
    font-size: 14px;
  }
</style>
</head>

<body>

<header>
  <h1>Toms Photography</h1>
  <p>Capturing real moments.</p>
</header>

<section class="gallery">
  <img src="photo1.JPG">
  <img src="photo2.JPG">
  <img src="photo3.JPG">
  <img src="photo4.JPG">
</section>

<section class="about">
  <h2>About</h2>
  <p>
    I focus on capturing real, unposed moments. My goal is to create images that feel natural, not forced.
  </p>
</section>

<footer>
  <p>Contact: neiltoms485@gmail.com</p>
</footer>

</body>
</html>
